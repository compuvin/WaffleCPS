name: Build packages

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-declarative
            mingw-w64-ucrt-x86_64-qt6-serialport
            mingw-w64-ucrt-x86_64-libusb
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-nsis
      - name: Build
        shell: msys2 {0}
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF
          cmake --build build --target wafflecps radio-transfer-helper -j 2
      - name: Package installer
        shell: msys2 {0}
        run: |
          set -euo pipefail
          mkdir -p build/deploy/definitions
          cp build/wafflecps.exe build/deploy/
          cp build/radio-transfer-helper.exe build/deploy/
          cp definitions/*.wcp build/deploy/definitions/
          cp packaging/qt.conf build/deploy/
          windeployqt --release --qmldir qml --dir build/deploy \
            build/deploy/wafflecps.exe
          cmake -DDEPLOY_DIR="$(cygpath -am build/deploy)" \
            -DMINGW_BIN="$(cygpath -am /ucrt64/bin)" \
            -P packaging/copy-windows-dependencies.cmake
          cpack --config build/CPackConfig.cmake -G NSIS -B dist
      - uses: actions/upload-artifact@v6
        with:
          name: windows-x64
          path: dist/*.exe
          if-no-files-found: error

  ubuntu:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ pkg-config \
            libusb-1.0-0-dev zlib1g-dev qt6-base-dev qt6-declarative-dev qt6-serialport-dev \
            qml6-module-qtqml qml6-module-qtqml-workerscript \
            qml6-module-qtquick qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts qml6-module-qtquick-templates \
            qml6-module-qtquick-window
      - name: Build and test
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build -j 2
          ctest --test-dir build --output-on-failure -j 2 \
            -E '^RequiresCodeplug-'
      - name: Build DEB
        run: |
          cpack --config build/CPackConfig.cmake -G DEB -B dist
          for package in dist/*.deb; do
            mv "$package" "${package%.deb}-${{ matrix.arch }}.deb"
          done
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb
      - uses: actions/upload-artifact@v6
        with:
          name: ubuntu-24.04-${{ matrix.arch }}
          path: dist/*.deb
          if-no-files-found: error

  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: brew install cmake ninja pkgconf qtbase qtdeclarative qtserialport qttools qtsvg libusb
      - name: Build app bundle
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF -DCMAKE_PREFIX_PATH="$(brew --prefix)"
          cmake --build build --target wafflecps radio-transfer-helper -j 2
      - name: Create DMG
        run: |
          set -euo pipefail
          app="build/wafflecps.app"
          test -d "$app"
          mkdir -p "$app/Contents/definitions" "$app/Contents/Frameworks" "$app/Contents/Resources"
          helper="$app/Contents/MacOS/radio-transfer-helper"
          cp build/radio-transfer-helper "$helper"
          cp definitions/*.wcp "$app/Contents/definitions/"
          cp LICENSE "$app/Contents/Resources/"
          "$(brew --prefix)/bin/macdeployqt" "$app" -qmldir=qml -executable="$helper"
          executable="$app/Contents/MacOS/wafflecps"
          cp "$(brew --prefix libusb)/lib/libusb-1.0.0.dylib" "$app/Contents/Frameworks/"
          for binary in "$executable" "$helper"; do
            libusb_link="$(otool -L "$binary" | awk '/libusb-1.0.*dylib/ {print $1; exit}')"
            test -n "$libusb_link"
            install_name_tool -change "$libusb_link" \
              "@executable_path/../Frameworks/libusb-1.0.0.dylib" "$binary"
          done
          codesign --force --sign - "$app/Contents/Frameworks/libusb-1.0.0.dylib"
          codesign --force --sign - "$helper"
          codesign --force --sign - "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          hdiutil create -volname WaffleCPS -srcfolder "$app" \
            -ov -format UDZO WaffleCPS-macos-arm64.dmg
      - uses: actions/upload-artifact@v6
        with:
          name: macos-arm64
          path: WaffleCPS-macos-arm64.dmg
          if-no-files-found: error

  publish:
    if: github.event_name == 'release'
    needs: [windows, ubuntu, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Attach packages to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(find dist -maxdepth 1 -name '*.exe' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -name '*.deb' | wc -l)" -eq 2
          test "$(find dist -maxdepth 1 -name '*.dmg' | wc -l)" -eq 1
          cd dist
          sha256sum *.exe *.deb *.dmg > SHA256SUMS
          gh release upload "$GITHUB_REF_NAME" ./*.exe ./*.deb ./*.dmg SHA256SUMS \
            --repo "$GITHUB_REPOSITORY"
